<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison Vell Runway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Syncopate:wght@400;700&display=swap">
<style>
/* Layout: passarela editorial em profundidade à esquerda, coluna de peças à direita; no celular, gaveta inferior. */
:root{
  --white:#FFFFFF; --ice:#FAFAF8; --ink:#171B20; --grey:#5C636A; --soft:#DADDE0; --line:#EEF0F1; --haze:#F1F6F9;
  --display:'Syncopate','Jost',ui-sans-serif,system-ui,sans-serif;
  --body:'Jost',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.7,.2,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--white);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.disp{font-family:var(--display);font-weight:400;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.only-m{display:none!important}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;flex:none}

.app{height:100%;display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.hd{background:var(--white);padding:12px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));position:relative;z-index:30}
.hd-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:44px}
.logo{font-family:var(--display);font-size:15px;letter-spacing:.26em;justify-self:start;padding:10px 0;white-space:nowrap}
.tabs{display:flex;gap:44px}
.tab{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:#6B7178;padding:10px 0;transition:color .3s}
.tab:hover,.tab.on{color:var(--ink)}
.tools{justify-self:end;display:flex;align-items:center;gap:2px}
.ic{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;position:relative;transition:opacity .3s}
.ic:hover{opacity:.6}
.badge{position:absolute;top:7px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--ink);color:var(--white);font-size:9px;line-height:15px;text-align:center;padding:0 4px;font-weight:500}
.cartbtn{font-size:11px;letter-spacing:.18em;height:44px;padding-left:10px;display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.sub{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 40px;padding-bottom:8px}
.subbtn{font-size:10.5px;letter-spacing:.2em;padding:8px 0;position:relative}
.subbtn::after{content:'';position:absolute;left:0;right:0;bottom:4px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.subbtn:hover::after{transform:scaleX(1)}

/* Passarela */
.main{flex:1;min-height:560px;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.stage-wrap{position:relative;isolation:isolate;z-index:0;overflow:hidden;background:radial-gradient(58% 60% at 30% 42%,var(--haze) 0%,rgba(255,255,255,0) 72%)}
.stage{position:absolute;inset:0;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.stage.drag{cursor:grabbing}
.stage:focus-visible{box-shadow:inset 0 0 0 1px var(--soft)}
.model{position:absolute;bottom:5%;height:86%;aspect-ratio:9/20;max-width:none;transform-origin:50% 100%;will-change:transform,filter,opacity}
.model img,.model svg{width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%;-webkit-user-drag:none;pointer-events:none}
.intro{position:absolute;top:26px;left:40px;max-width:330px;z-index:20;pointer-events:none}
.h1{font-size:24px;letter-spacing:.1em;margin:0 0 18px;line-height:1.25;text-wrap:balance}
.lede{margin:0;font-size:12.5px;line-height:1.7;color:var(--grey);max-width:300px}
.lookbar{position:absolute;left:40px;bottom:32px;z-index:20;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.code{font-size:30px;letter-spacing:.16em;margin:0;line-height:1}
.ltitle{font-size:11px;letter-spacing:.22em;color:var(--grey);margin:0;text-transform:uppercase}
.link{font-size:10.5px;letter-spacing:.2em;padding:8px 0 4px;border-bottom:1px solid var(--ink);text-transform:uppercase;transition:opacity .3s}
.link:hover{opacity:.6}
.nav{position:absolute;right:24px;bottom:28px;z-index:20;display:flex;align-items:center;gap:8px}
.count{font-size:11px;letter-spacing:.2em;color:var(--grey);margin-right:10px;font-variant-numeric:tabular-nums}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--soft);display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);transition:border-color .3s,transform .3s}
.arrow:hover:not(:disabled){border-color:var(--ink);transform:scale(1.05)}
.arrow:disabled{opacity:.3;cursor:default}
.hint{position:absolute;top:56%;z-index:15;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;transform:translate(-50%,-50%);transition:opacity .6s}
.hint span:first-child{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);animation:pulse 2.4s ease-in-out infinite}
.hint span:last-child{font-size:9.5px;letter-spacing:.24em;color:var(--grey)}
.hint.gone{opacity:0}

/* Peças */
.prods{display:flex;flex-direction:column;padding:10px 26px 14px 6px;min-height:0;background:var(--white);position:relative;z-index:22}
.sheet-hd{display:none}
.plist{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.prod{flex:1 1 0;min-height:0;display:flex;flex-direction:column;animation:inA .7s var(--ease) both}
.plist.b .prod{animation-name:inB}
.media{position:relative;flex:1;min-height:72px}
.open{position:absolute;inset:0;width:100%;display:flex;align-items:center;justify-content:center}
.open img{max-height:100%;max-width:100%;object-fit:contain;transition:transform .6s var(--ease)}
.open:hover img,.open:hover .ph{transform:scale(1.04)}
.ph{width:100%;height:100%;background:var(--ice);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;transition:transform .6s var(--ease)}
.ph i{display:block;width:26px;height:26px;border-radius:50%}
.ph b{font-weight:400;font-size:9px;letter-spacing:.2em;color:var(--grey);text-transform:uppercase}
.heart{position:absolute;top:-8px;left:-12px;z-index:2;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.heart svg{width:15px;height:15px;stroke:var(--ink);stroke-width:1.4;fill:none}
.heart.on svg{fill:var(--ink);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.meta{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding-top:2px}
.pname{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;display:block;padding:2px 0;line-height:1.4}
.price{font-size:11px;letter-spacing:.06em;color:var(--grey);margin-top:2px;font-variant-numeric:tabular-nums}
.plus{width:44px;height:44px;margin:0 -12px -10px 0;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .35s}
.plus:hover{transform:rotate(90deg)}

/* Painéis */
.ov{position:fixed;inset:0;z-index:60;background:rgba(23,27,32,.26);display:flex;animation:fade .3s both}
.dw{background:var(--white);outline:none;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dw.side{margin-left:auto;width:min(430px,100%);height:100%;animation:slideR .5s var(--ease) both}
.dw.left{margin-right:auto;width:min(340px,88%);height:100%;animation:slideL .5s var(--ease) both}
.ov.solid{background:var(--white);animation:none}
.dw.page{width:100%;height:100%;margin:0;animation:rise .45s var(--ease) both}
.dw.page .dw-body{display:flex;align-items:center}
.dw.page .detail{width:min(1080px,100%);margin:auto}
.dw.modal{margin:auto;width:min(900px,calc(100% - 32px));max-height:calc(100% - 48px);animation:rise .5s var(--ease) both}
.dw.wide{margin:auto;width:min(1120px,calc(100% - 32px));height:calc(100% - 64px);animation:rise .5s var(--ease) both}
.dw-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px 10px 28px;border-bottom:1px solid var(--line)}
.dw-title{font-size:13px;letter-spacing:.16em;margin:0}
.dw-body{flex:1;overflow-y:auto;padding:20px 28px 28px}
.dw-ft{border-top:1px solid var(--line);padding:18px 28px 22px;display:flex;flex-direction:column;gap:12px}
.btn{background:var(--ink);color:var(--white);min-height:48px;padding:0 26px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:background .3s;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:hover:not(:disabled){background:#2E353D}
.btn:disabled{background:#ECEEEF;color:var(--grey);cursor:not-allowed}
.ghost{border:1px solid var(--ink);min-height:44px;padding:0 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .3s;white-space:nowrap}
.ghost:hover{background:var(--ice)}
.li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.li-th{width:76px;height:96px;background:var(--ice);display:flex;align-items:center;justify-content:center;overflow:hidden}
.li-th img{max-width:100%;max-height:100%;object-fit:contain}
.li-th .ph{padding:4px}
.li-th .ph b{display:none}
.li-name{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 4px;line-height:1.4}
.li-sub{font-size:11px;color:var(--grey);margin:0;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.li-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--soft);height:40px}
.qty button{width:40px;height:38px;display:flex;align-items:center;justify-content:center}
.qty span{min-width:22px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.mini{font-size:10px;letter-spacing:.18em;color:var(--grey);padding:8px 0;text-transform:uppercase}
.mini:hover{color:var(--ink)}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.sum strong{font-weight:500;font-size:15px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--grey);margin:0;line-height:1.5}
.empty{font-size:13px;color:var(--grey);padding:32px 0;margin:0;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:30px 22px}
.card{display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.card .media{aspect-ratio:4/5;flex:none;background:var(--ice);max-width:100%}
.card .open{padding:16px}
.card .heart{top:0;left:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{min-height:40px;padding:0 18px;border:1px solid var(--soft);font-size:10.5px;letter-spacing:.18em;transition:all .3s}
.chip.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.lb{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:22px}
.lbc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px 16px;background:var(--ice);border:1px solid transparent;transition:border-color .3s,transform .4s}
.lbc:hover{transform:translateY(-3px)}
.lbc.on{border-color:var(--ink)}
.lbc .fig{height:250px;aspect-ratio:9/20;max-width:100%}
.lbc .fig img,.lbc .fig svg{width:100%;height:100%;object-fit:contain;display:block}
.lbc .disp{font-size:13px;letter-spacing:.16em}
.label{font-size:10px;letter-spacing:.2em;color:var(--grey);text-transform:uppercase;display:block;margin-bottom:4px}
.input{width:100%;height:56px;border:0;border-bottom:1px solid var(--ink);font:inherit;font-size:20px;letter-spacing:.04em;outline:none;background:transparent;color:var(--ink);padding:0;border-radius:0}
.input::placeholder{color:#8A9097}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:36px}
.d-media{background:var(--ice);height:min(480px,54vh);display:flex;align-items:center;justify-content:center;padding:24px;max-width:100%}
.d-media img{max-width:100%;max-height:100%;object-fit:contain}
.d-info{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:6px 0;min-width:0}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--grey);margin:0;text-transform:uppercase}
.h2{font-size:20px;letter-spacing:.1em;margin:0;line-height:1.3;text-wrap:balance}
.price-lg{font-size:16px;letter-spacing:.06em;margin:0;font-variant-numeric:tabular-nums}
.body{font-size:13.5px;line-height:1.7;color:#4E555C;margin:0;max-width:440px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.menu{display:flex;flex-direction:column}
.menu button{min-height:52px;font-size:12px;letter-spacing:.2em;border-bottom:1px solid var(--line)}
.menu .disp{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--white);font-size:11px;letter-spacing:.18em;padding:14px 22px;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:80;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes inA{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.55}}

@media (max-width:899px){
  .only-d{display:none!important}
  .only-m{display:inline-flex!important}
  .hd{padding:4px max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
  .hd-row{grid-template-columns:auto 1fr auto;gap:4px}
  .logo{justify-self:center;font-size:12.5px;letter-spacing:.24em}
  .main{display:block;flex:none;min-height:0}
  .stage-wrap{height:calc(100svh - 53px - 172px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:400px}
  .intro{top:14px;left:max(16px,env(safe-area-inset-left,0px));right:16px}
  .h1{font-size:13px;margin:0}
  .lede,.ltitle,.count,.hint{display:none}
  .lookbar{left:max(16px,env(safe-area-inset-left,0px));bottom:14px;gap:6px}
  .code{font-size:21px}
  .nav{right:10px;bottom:10px;gap:4px}
  .prods{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(172px + env(safe-area-inset-bottom,0px));padding:4px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 32px rgba(23,27,32,.06);transition:height .5s var(--ease)}
  .prods.open-s{height:min(78vh,640px)}
  .sheet-hd{display:flex;justify-content:space-between;align-items:center;padding:0 max(10px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
  .sheet-btn{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 8px;font-size:10.5px;letter-spacing:.18em}
  .sheet-btn svg{transition:transform .4s}
  .prods.open-s .sheet-btn svg{transform:rotate(180deg)}
  .plist{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 max(16px,env(safe-area-inset-left,0px));gap:16px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .prod{flex:0 0 128px;scroll-snap-align:start}
  .prods.open-s .plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow-y:auto;overflow-x:hidden;align-content:start;gap:22px 16px}
  .prods.open-s .prod{height:250px;flex:none}
  .dw.modal,.dw.wide{width:100%;height:100%;max-height:none;margin:0}
  .dw-body{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .dw-hd{padding:6px 6px 6px 18px}
  .dw-ft{padding:16px 18px 20px}
  .toast{bottom:calc(190px + env(safe-area-inset-bottom,0px))}
  .li{grid-template-columns:64px minmax(0,1fr) auto;gap:12px}
  .li-th{width:64px;height:82px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- loja: barra, tamanhos, checkout, ajuda ---------- */
:root{--err:#A3261B;--ok:#2F5D46}
.bar{background:var(--ink);color:var(--white);font-size:10px;letter-spacing:.2em;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));text-transform:uppercase;line-height:1.4}
.bar span+span::before{content:'·';margin:0 12px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:48px;height:44px;border:1px solid var(--soft);font-size:12px;letter-spacing:.06em;padding:0 12px;text-align:center;transition:border-color .2s,background .2s}
.sz:hover{border-color:var(--ink)}
.sz.on{border-color:var(--ink);background:var(--ink);color:var(--white)}
.err{color:var(--err);font-size:12px;margin:0;line-height:1.5}
.err:empty{display:none}
.small{font-size:12px;color:var(--grey);margin:0;line-height:1.6}
.small strong{color:var(--ink);font-weight:500}
.perks{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px;width:100%}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:12px}
.prog{height:2px;background:var(--line);margin-top:8px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .5s var(--ease)}
.also{width:100%;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.also .li{padding:10px 0}
.sel{height:40px;border:1px solid var(--soft);background:var(--white);color:var(--ink);font:inherit;font-size:12px;padding:0 10px;border-radius:0}
.sel[aria-invalid="true"]{border-color:var(--err)}
.dw.page .co-wrap{width:min(1120px,100%);margin:0 auto}
.co{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:48px;align-items:start}
.co-sec{padding:0 0 28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.co-sec h3{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.16em;margin:0 0 18px;text-transform:uppercase}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 12px}
.f{grid-column:span 6;display:flex;flex-direction:column;gap:6px;min-width:0}
.f.s2{grid-column:span 2}.f.s3{grid-column:span 3}.f.s4{grid-column:span 4}
.f label{font-size:10px;letter-spacing:.18em;color:var(--grey);text-transform:uppercase}
.tx{height:48px;border:1px solid var(--soft);padding:0 14px;font:inherit;font-size:15px;width:100%;background:var(--white);color:var(--ink);border-radius:0;outline:none;transition:border-color .2s}
.tx:focus{border-color:var(--ink)}
.tx[aria-invalid="true"]{border-color:var(--err)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--soft);padding:14px 16px;cursor:pointer;transition:border-color .2s}
.opt:hover,.opt:has(input:checked){border-color:var(--ink)}
.opt input{accent-color:var(--ink);width:18px;height:18px;margin:0}
.opt b{display:block;font-weight:500;font-size:13px;letter-spacing:.04em}
.opt span{font-size:12px;color:var(--grey)}
.opt em{font-style:normal;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.co-sum{background:var(--ice);padding:24px;position:sticky;top:0}
.co-sum h3{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.16em;margin:0 0 12px;text-transform:uppercase}
.co-sum .li{grid-template-columns:56px minmax(0,1fr) auto;padding:10px 0}
.co-sum .li-th{width:56px;height:70px;background:var(--white)}
.sumrow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;font-variant-numeric:tabular-nums}
.sumrow.disc{color:var(--ok)}
.sumrow.tot{font-size:16px;font-weight:500;border-top:1px solid var(--soft);padding-top:14px;margin-top:10px}
.coupon{display:flex;gap:8px;margin:14px 0 6px}
.coupon .tx{height:44px;font-size:13px;text-transform:uppercase}
.secure{display:flex;gap:10px;align-items:flex-start;font-size:11.5px;color:var(--grey);line-height:1.55;margin:14px 0 0}
.secure svg{flex:none;margin-top:2px}
.done{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:24px 0}
.done .num{font-family:var(--display);font-size:13px;letter-spacing:.16em}
.notice{border:1px solid var(--soft);background:var(--ice);padding:16px 18px;font-size:13px;line-height:1.6;color:#4E555C;width:100%}
.help details{border-bottom:1px solid var(--line)}
.help summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:56px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:'+';font-size:18px;font-weight:300}
.help details[open] summary::after{content:'–'}
.help .hb{padding:0 0 22px;display:flex;flex-direction:column;gap:12px}
.tblw{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.wa{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(23,27,32,.18)}
/* v8: estoque, ficha, filtros, galeria, cookies */
.sz.out{color:#9AA0A6;text-decoration:line-through;cursor:not-allowed;border-style:dashed}
.sz.out:hover{border-color:var(--soft)}
.low{color:var(--err)!important}
.finder{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--ice);width:100%}
.spec{width:100%;border-top:1px solid var(--line)}
.spec details{border-bottom:1px solid var(--line)}
.spec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.spec summary::-webkit-details-marker{display:none}
.spec summary::after{content:'+';font-size:16px;font-weight:300}
.spec details[open] summary::after{content:'–'}
.spec details p{padding-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-10px 0 26px}
.gal{display:flex;flex-direction:column;gap:10px;min-width:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{width:64px;height:80px;background:var(--ice);border:1px solid transparent;padding:4px}
.th.on{border-color:var(--ink)}
.th img{width:100%;height:100%;object-fit:contain}
.btn:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}
.cookie{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;max-width:420px;background:var(--white);border:1px solid var(--soft);box-shadow:0 12px 32px rgba(23,27,32,.12);padding:16px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.cookie p{margin:0;font-size:12px;line-height:1.6;color:#4E555C}
.cookie .btn{min-height:40px}
@media (max-width:899px){
  .cookie{right:max(16px,env(safe-area-inset-right,0px));max-width:none}
}
@media (max-width:899px){
  .bar .only-d{display:none!important}
  .bar span+span::before{display:none}
  .stage-wrap{height:calc(100svh - 53px - 30px - 172px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))!important}
  .co{grid-template-columns:minmax(0,1fr);gap:28px}
  .co-sum{position:static;order:-1;padding:18px}
  .f.s2,.f.s4{grid-column:span 3}
  .f.s3{grid-column:span 6}
  .wa{bottom:calc(190px + env(safe-area-inset-bottom,0px))}
}
</style>

const models = LOOKS.map((l) => { const d = document.createElement('div'); d.className = 'model'; d.dataset.idx = l.idx; d.innerHTML = l.idx > 2 ? figHTML(l).replace('<img ','<img loading="lazy" ') : figHTML(l); stage.appendChild(d); return d; });
let stageW = 1000, mobile = false;
const measure = () => { stageW = stage.clientWidth || 1000; mobile = innerWidth < 900; layout(); };
const spacing = () => mobile ? Math.max(90, stageW * 0.3) : Math.max(120, Math.min(240, stageW * 0.19));

function layout(){
  const sp = spacing();
  const eff = Math.max(-0.45, Math.min(N - 0.55, S.active + S.dragDx / sp));
  const center = mobile ? 58 : 63;
  const tr = S.dragging ? 'none' : ['transform','filter','opacity'].map((p) => p + ' ' + (reduce?'.01s':'.95s') + ' cubic-bezier(.22,.7,.2,1)').join(',');
  models.forEach((el, i) => {
    const d = i - eff; let x, sc, ty, blur, op;
    if (d >= 0) { x = -sp * (1 - Math.pow(0.8, d)) / 0.2; sc = Math.max(0.34, Math.pow(0.8, d)); ty = -(1 - sc) * 46; blur = Math.min(9, d * 2.6); op = Math.max(0, 1 - d * 0.15); if (d > 5.2) op = Math.max(0, op - (d - 5.2) * 1.5); }
    else { const a = -d; x = a * sp * 1.25; sc = 1 + a * 0.06; ty = a * 2; blur = Math.min(10, a * 5); op = Math.max(0, 1 - a * (mobile ? 0.7 : 1.1)); }
    const st = el.style;
    st.left = center + '%';
    st.transition = tr;
    st.transform = 'translateX(calc(-50% + ' + x.toFixed(1) + 'px)) translateY(' + ty.toFixed(2) + '%) scale(' + sc.toFixed(4) + ')';
    st.filter = blur < 0.05 ? 'none' : 'blur(' + blur.toFixed(2) + 'px)';
    st.opacity = op.toFixed(3);
    st.zIndex = Math.round(200 - Math.abs(d) * 10 - (d < 0 ? 5 : 0));
    st.visibility = op > 0.01 && d < 7 ? 'visible' : 'hidden';
    el.setAttribute('aria-hidden', i === S.active ? 'false' : 'true');
  });
  const h = $('hint'); h.style.left = 'calc(' + center + '% - ' + Math.round(sp * 0.56) + 'px)'; h.classList.toggle('gone', S.hinted);
}

let fadeFlip = false;
function renderLook(){
  const l = LOOKS[S.active];
  $('code').textContent = l.code; $('ltitle').textContent = l.title;
  $('count').textContent = String(S.active+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('toRight').disabled = S.active === 0; $('toLeft').disabled = S.active === N - 1;
  $('sheetInfo').textContent = l.code + ' · ' + l.products.length + (l.products.length===1?' peça':' peças');
  $('live').textContent = l.code + ' de ' + N + ': ' + l.title + '. ' + l.products.map((p) => p.name + ', ' + fmt(p.price)).join('; ');
  fadeFlip = !fadeFlip;
  const pl = $('plist'); pl.className = 'plist' + (fadeFlip ? ' b' : '');
  pl.innerHTML = l.products.map((p,i) => {
    const f = !!S.favs[p.id];
    return '<article class="prod" style="animation-delay:' + (i*90) + 'ms">' +
      '<div class="media"><button class="heart' + (f?' on':'') + '" data-a="fav" data-id="'+p.id+'" aria-pressed="'+f+'" aria-label="' + (f?'Remover dos favoritos: ':'Adicionar aos favoritos: ') + esc(p.name) + '">' + heartSVG + '</button>' +
      '<button class="open" data-a="product" data-id="'+p.id+'" aria-label="Ver detalhes: ' + esc(p.name) + '">' + prodHTML(p) + '</button></div>' +
      '<div class="meta"><div><button class="pname" data-a="product" data-id="'+p.id+'">' + esc(p.name) + '</button><div class="price">' + fmt(p.price) + '</div></div>' +
      '<button class="plus" data-a="quick" data-id="'+p.id+'" aria-label="Adicionar à sacola: ' + esc(p.name) + '">' + plusSVG + '</button></div></article>';
  }).join('');
}
function go(i){
  i = Math.max(0, Math.min(N - 1, i));
  const changed = i !== S.active;
  S.active = i; S.hinted = true; S.dragDx = 0; S.dragging = false;
  layout(); if (changed) renderLook();
  if (S.panel === 'look') renderPanel();
}

/* arrastar / deslizar */
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const t = e.target.closest('[data-idx]');
  drag = { x:e.clientX, idx: t ? +t.dataset.idx : null, moved:false, dx:0 };
  try { stage.setPointerCapture(e.pointerId); } catch(err) {}
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 6) return;
  drag.moved = true; drag.dx = dx;
  S.dragDx = dx; S.dragging = true; S.hinted = true; stage.classList.add('drag');
  layout();
});
const endDrag = () => {
  const d = drag; drag = null; stage.classList.remove('drag');
  if (!d) return;
  if (d.moved) { let steps = Math.round(d.dx / spacing()); if (!steps && Math.abs(d.dx) > 30) steps = d.dx > 0 ? 1 : -1; go(S.active + steps); }
  else if (d.idx != null) go(d.idx);
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

document.addEventListener('keydown', (e) => {
  if (S.panel) { if (e.key === 'Escape') closePanel(); return; }
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(S.active + 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(S.active - 1); }
  else if (e.key === 'Home' && document.activeElement === stage) { e.preventDefault(); go(0); }
  else if (e.key === 'End' && document.activeElement === stage) { e.preventDefault(); go(N - 1); }
});

let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }
function add(id, size, q){
  const p = byId[id], k = lineKey(id, size), want = (S.cart[k] || 0) + (q || 1), max = stockOf(p, size);
  if (max <= 0) { toast('TAMANHO ESGOTADO'); return false; }
  if (want > max) { S.cart[k] = max; save(); renderCounts(); toast('SÓ TEMOS ' + max + ' EM ESTOQUE'); return false; }
  S.cart[k] = want; save(); renderCounts(); track('add_to_cart', { currency:'BRL', value:p.price, items:[{ item_id:id, item_name:p.name, item_variant:size }] }); return true;
}
function setQty(k, q){ const [id,sz] = k.split('|'); const max = byId[id] ? stockOf(byId[id], sz) : Infinity; if (q > max) { q = max; toast('SÓ TEMOS ' + max + ' EM ESTOQUE'); } if (q <= 0) delete S.cart[k]; else S.cart[k] = q; save(); renderCounts(); }
function toggleFav(id){ const on = !S.favs[id]; if (on) S.favs[id] = true; else delete S.favs[id]; save(); renderCounts(); renderLook(); toast(on ? 'SALVO NOS FAVORITOS' : 'REMOVIDO DOS FAVORITOS'); }
function quickAdd(id){
  const p = byId[id];
  if (single(p)) { if (add(id, sizesOf(p)[0])) toast('ADICIONADO À SACOLA'); if (S.panel) renderPanel(false); return; }
  openPanel('product', { pid:id, size:null }); toast('ESCOLHA O TAMANHO');
}

  if (k === 'product') { S.gi = 0; S.finder = false; const p = byId[S.pid]; if (p && single(p) && inStock(p, sizesOf(p)[0])) S.size = sizesOf(p)[0];
    setHash('produto-' + S.pid); track('view_item', { currency:'BRL', value:p ? p.price : 0, items:[{ item_id:S.pid }] }); }
  else setHash('');

const PRICE_F = [['','Todos os preços'],['0-500','Até R$ 500'],['500-1000','R$ 500 a R$ 1.000'],['1000-99999','Acima de R$ 1.000']];
function shopBody(){
  const C = [['todos','TODOS'],['roupas','ROUPAS'],['calcados','CALÇADOS'],['acessorios','ACESSÓRIOS']];
  const allSizes = [...new Set(ALL.filter((p) => S.cat === 'todos' || p.cat === S.cat).flatMap((p) => single(p) ? [] : sizesOf(p)))];
  if (S.fsize && !allSizes.includes(S.fsize)) S.fsize = '';
  let list = ALL.filter((p) => S.cat === 'todos' || p.cat === S.cat);
  if (S.fsize) list = list.filter((p) => sizesOf(p).includes(S.fsize) && inStock(p, S.fsize));
  if (S.fprice) { const [lo,hi] = S.fprice.split('-').map(Number); list = list.filter((p) => p.price >= lo && p.price <= hi); }
  if (S.sort === 'menor') list = list.slice().sort((a,b) => a.price - b.price);
  if (S.sort === 'maior') list = list.slice().sort((a,b) => b.price - a.price);
  const opt = (v, l, cur) => '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + l + '</option>';
  return '<div class="dw-body"><div class="chips" role="group" aria-label="Filtrar por categoria">' + C.map(([c,lb]) => '<button class="chip' + (S.cat===c?' on':'') + '" data-a="cat" data-c="'+c+'" aria-pressed="' + (S.cat===c) + '">' + lb + '</button>').join('') + '</div>' +
    '<div class="filters"><label class="sr" for="f-size">Tamanho</label><select class="sel" id="f-size" data-flt="fsize">' + opt('','Todos os tamanhos',S.fsize) + allSizes.map((z) => opt(z,'Tamanho ' + z,S.fsize)).join('') + '</select>' +
    '<label class="sr" for="f-price">Faixa de preço</label><select class="sel" id="f-price" data-flt="fprice">' + PRICE_F.map(([v,l]) => opt(v,l,S.fprice)).join('') + '</select>' +
    '<label class="sr" for="f-sort">Ordenar</label><select class="sel" id="f-sort" data-flt="sort">' + opt('destaque','Destaques',S.sort) + opt('menor','Menor preço',S.sort) + opt('maior','Maior preço',S.sort) + '</select>' +
    '<span class="small" style="margin-left:auto">' + list.length + (list.length === 1 ? ' peça' : ' peças') + '</span></div>' +
    (list.length ? '<div class="grid">' + list.map(card).join('') + '</div>' : '<div class="empty">Nenhuma peça com esses filtros. <button class="mini" data-a="clearf">Limpar filtros</button></div>') + '</div>';
}
function recommend(p, vals){
  if (p.cat === 'calcados') { const f = vals.foot; if (!f) return null; const r = SHOE_TABLE.find((x) => parseFloat(x[1].replace(',','.')) >= f); return r ? r[0] : null; }
  const cols = { bust:2, waist:3, hip:4 }; let idx = -1;
  for (const k of Object.keys(cols)) { const v = vals[k]; if (!v) continue;
    let i = SIZE_TABLE.findIndex((r) => v <= parseFloat(r[cols[k]].split('–')[1]));
    if (i < 0) return 'acima';
    idx = Math.max(idx, i); }
  return idx < 0 ? null : SIZE_TABLE[idx][0];
}

/* máscaras */
const MASK = {
  cpf: (v) => digits(v).slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'),
  phone: (v) => { const d = digits(v).slice(0,11); return d.length > 10 ? d.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3') : d.replace(/(\d{2})(\d{0,4})(\d{0,4})/,'($1) $2-$3').replace(/[-\s()]+$/,''); },
  cep: (v) => digits(v).slice(0,8).replace(/(\d{5})(\d)/,'$1-$2')
};
function validCPF(v){
  const d = digits(v); if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += +d[i] * (t + 1 - i); if (((s * 10) % 11) % 10 !== +d[t]) return false; }
  return true;
}
let cepLast = '';
function lookupCEP(){
  const d = digits(S.co.cep); if (d.length !== 8 || d === cepLast) return; cepLast = d;
  const info = $('cepInfo'); if (info) info.textContent = 'Buscando endereço…';
  fetch('https://viacep.com.br/ws/' + d + '/json/').then((r) => r.json()).then((j) => {
    if (j.erro) { if (info) info.textContent = 'CEP não encontrado. Preencha o endereço abaixo.'; return; }
    const map = { street:j.logradouro, district:j.bairro, city:j.localidade, uf:j.uf };
    Object.keys(map).forEach((k) => { if (map[k]) { S.co[k] = map[k]; const el = $('co-' + k); if (el) el.value = map[k]; } });
    if (info) info.textContent = 'Endereço encontrado. Confira e informe o número.';
    const n = $('co-number'); if (n && !S.co.number) n.focus();
  }).catch(() => { if (info) info.textContent = 'Preencha o endereço abaixo.'; });
}
function validate(){
  const c = S.co, E = {};
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email.trim())) E.email = 'Informe um e-mail válido, como nome@email.com.';
  if (c.name.trim().split(/\s+/).length < 2) E.name = 'Informe nome e sobrenome.';
  if (!validCPF(c.cpf)) E.cpf = 'CPF inválido. Confira os 11 números.';
  if (digits(c.phone).length < 10) E.phone = 'Informe o celular com DDD.';
  if (digits(c.cep).length !== 8) E.cep = 'O CEP tem 8 números.';
  if (!c.street.trim()) E.street = 'Informe o endereço.';
  if (!c.number.trim()) E.number = 'Informe o número (ou S/N).';
  if (!c.district.trim()) E.district = 'Informe o bairro.';
  if (!c.city.trim()) E.city = 'Informe a cidade.';
  if (!c.uf) E.uf = 'Escolha o estado.';
  ['email','name','cpf','phone','cep','street','number','district','city','uf'].forEach((k) => {
    const el = $('co-' + k), er = $('e-' + k);
    if (el) el.setAttribute('aria-invalid', E[k] ? 'true' : 'false');
    if (er) er.textContent = E[k] || '';
  });
  return E;
}
function orderNumber(){ const d = new Date(); return 'MV' + String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '-' + Math.random().toString(36).slice(2,6).toUpperCase(); }

  const ov = $('overlay');
  const prevBody = ov.querySelector('.dw-body'); const scroll = prevBody ? prevBody.scrollTop : 0;
  ov.innerHTML = '<div class="ov' + (SOLID.includes(k) ? ' solid' : '') + '" data-a="close-bg"><div class="dw ' + KIND[k] + '" role="dialog" aria-modal="true" aria-label="' + TITLES[k] + '" tabindex="-1" id="dw"' + (first ? '' : ' style="animation:none"') + '>' +
    '<div class="dw-hd"><h2 class="dw-title disp">' + TITLES[k] + '</h2><button class="ic" data-a="close" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    panelBody(k) + '</div></div>';
  if (!first) { const ovEl = ov.querySelector('.ov'); ovEl.style.animation = 'none'; const b = ov.querySelector('.dw-body'); if (b) b.scrollTop = scroll; }
  if (k === 'checkout') refreshCheckout();
  if (k === 'help' && S.help && first) { const d = $('h-' + S.help); if (d) setTimeout(() => d.scrollIntoView({block:'start'}), 50); }
  if (k === 'search') { renderResults(); const q = $('q'); q.addEventListener('input', () => { S.q = q.value; renderResults(); }); if (first) q.focus(); }
  else if (first) $('dw').focus();
}

/* ---------- ações (delegação) ---------- */
function needSize(p){
  if (single(p) || S.size) return false;
  const er = $('sizeErr'); if (er) er.textContent = 'Escolha um tamanho.';
  const b = document.querySelector('.sz'); if (b) b.focus();
  return true;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'close-bg') { if (e.target === t) closePanel(); return; }
  if (a === 'close') return closePanel();
  if (a === 'runway') { if (S.panel) closePanel(); return; }
  if (a === 'panel') return openPanel(t.dataset.k, t.dataset.c ? { cat:t.dataset.c } : t.dataset.h ? { help:t.dataset.h } : (t.dataset.k === 'shop' ? { cat:'todos' } : t.dataset.k === 'help' ? { help:null } : null));
  if (a === 'step') return go(S.active + (+t.dataset.d));
  if (a === 'sheet') { S.sheet = !S.sheet; $('prods').classList.toggle('open-s', S.sheet); t.setAttribute('aria-expanded', S.sheet); $('sheetLabel').textContent = S.sheet ? 'RECOLHER' : 'VER PEÇAS'; return; }
  if (a === 'product') return openPanel('product', { pid:id, size:null });
  if (a === 'size') { S.size = t.dataset.s; const keep = S.finder; renderPanel(false); S.finder = keep; return; }
  if (a === 'fav') { toggleFav(id); if (S.panel) renderPanel(false); return; }
  if (a === 'quick') return quickAdd(id);
  if (a === 'addp') { const p = byId[id]; if (needSize(p)) return; if (add(id, S.size)) toast('ADICIONADO À SACOLA'); return; }
  if (a === 'buy') { const p = byId[id]; if (needSize(p)) return; if (inCart(id, S.size) >= stockOf(p, S.size) || add(id, S.size)) return openPanel('checkout'); return; }
  if (a === 'addone') { const p = byId[id], s = single(p) ? sizesOf(p)[0] : S.lookSizes[id];
    if (!s) { const sel = $('ls-' + id); if (sel) { sel.setAttribute('aria-invalid','true'); sel.focus(); } $('lookErr').textContent = 'Escolha o tamanho de ' + p.name + '.'; return; }
    if (add(id, s)) toast('ADICIONADO À SACOLA'); return; }
  if (a === 'addlook') { const ps = LOOKS[S.active].products; const miss = ps.filter((p) => !single(p) && !S.lookSizes[p.id]);
    if (miss.length) { miss.forEach((p) => { const sel = $('ls-' + p.id); if (sel) sel.setAttribute('aria-invalid','true'); }); $('lookErr').textContent = 'Escolha o tamanho de: ' + miss.map((p) => p.name).join(', ') + '.'; const f = $('ls-' + miss[0].id); if (f) f.focus(); return; }
    const out = ps.filter((p) => !inStock(p, single(p) ? sizesOf(p)[0] : S.lookSizes[p.id]));
    if (out.length) { $('lookErr').textContent = 'Esgotado: ' + out.map((p) => p.name).join(', ') + '. Escolha outro tamanho ou adicione as outras peças separadamente.'; return; }
    ps.forEach((p) => add(p.id, single(p) ? sizesOf(p)[0] : S.lookSizes[p.id])); return openPanel('checkout'); }
  if (a === 'qty') { setQty(t.dataset.k, (S.cart[t.dataset.k] || 0) + (+t.dataset.d)); return renderPanel(false); }
  if (a === 'remove') { setQty(t.dataset.k, 0); return renderPanel(false); }
  if (a === 'cat') { S.cat = t.dataset.c; return renderPanel(false); }
  if (a === 'clearf') { S.fsize = ''; S.fprice = ''; S.sort = 'destaque'; return renderPanel(false); }
  if (a === 'gi') { S.gi = +t.dataset.i; return renderPanel(false); }
  if (a === 'finder') { S.finder = !S.finder; renderPanel(false); const f = document.querySelector('[data-fd]'); if (f) f.focus(); return; }
  if (a === 'findsize') { const p = byId[S.pid], v = {}; document.querySelectorAll('[data-fd]').forEach((el) => { const n = parseFloat(el.value.replace(',','.')); if (n > 0) v[el.dataset.fd] = n; });
    const r = recommend(p, v), out = $('recOut');
    if (!r) { out.textContent = 'Preencha pelo menos uma medida.'; return; }
    if (r === 'acima') { out.textContent = 'Suas medidas passam da nossa tabela. Fale com a loja para uma indicação.'; return; }
    if (!inStock(p, r)) { out.textContent = 'Recomendamos o tamanho ' + r + ', mas ele está esgotado nesta peça.'; return; }
    S.size = r; renderPanel(false); const o2 = $('recOut'); if (o2) o2.textContent = 'Recomendamos o tamanho ' + r + '. Já selecionamos para você.'; return; }
  if (a === 'golook') { closePanel(); return go(+t.dataset.i); }
  if (a === 'checkout') return openPanel('checkout');
  if (a === 'coupon') { const er = $('e-coupon');
    if (S.co.coupon) { S.co.coupon = ''; S.co.couponIn = ''; refreshCheckout(); return; }
    const code = S.co.couponIn.trim().toUpperCase();
    if (CONFIG.COUPONS[code]) { S.co.coupon = code; refreshCheckout(); toast('CUPOM APLICADO'); }
    else if (er) er.textContent = code ? 'Cupom inválido ou expirado.' : 'Digite um cupom.';
    return; }
  if (a === 'sent') { S.cart = {}; save(); renderCounts(); setTimeout(() => { closePanel(); toast('PEDIDO ENVIADO PELO WHATSAPP'); }, 400); return; }
});
document.addEventListener('input', (e) => {
  const t = e.target; const f = t.dataset && t.dataset.f; if (!f) return;
  if (MASK[f]) { const v = MASK[f](t.value); if (v !== t.value) t.value = v; }
  S.co[f] = f === 'inst' ? +t.value : t.value;
  if (t.getAttribute('aria-invalid') === 'true') { t.setAttribute('aria-invalid','false'); const er = $('e-' + f); if (er) er.textContent = ''; }
  if (f === 'cep') lookupCEP();
  if (f === 'inst') refreshCheckout();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.flt) { S[t.dataset.flt] = t.value; renderPanel(false); const el = $(t.id); if (el) el.focus(); return; }
  if (t.dataset && t.dataset.ls) { S.lookSizes[t.dataset.ls] = t.value; t.setAttribute('aria-invalid','false'); const er = $('lookErr'); if (er) er.textContent = ''; return; }
  if (t.dataset && t.dataset.f === 'uf') { S.co.uf = t.value; return; }
  if (t.name === 'ship') { S.co.ship = t.value; refreshCheckout(); }
  if (t.name === 'pay') { S.co.pay = t.value; if (t.value === 'card') S.co.inst = installments(totals().total).n; refreshCheckout(); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'coForm') { e.preventDefault(); submitOrder(); } });

function setHash(h){
  try { const cur = location.hash.slice(1); if (cur === h) return;
    if (h) history.replaceState(null, '', '#' + h); else if (cur) history.replaceState(null, '', location.pathname + location.search);
  } catch(e) {}
}
function fromHash(){
  const m = /^#produto-([A-Za-z0-9-]+)$/.exec(location.hash || '');
  if (m && byId[m[1]] && !(S.panel === 'product' && S.pid === m[1])) { go(byId[m[1]].lookIdx); openPanel('product', { pid:m[1], size:null }); }
}
addEventListener('hashchange', fromHash);
/* aviso de cookies (LGPD) */
(function(){ let ok = false; try { ok = localStorage.getItem('maisonvell:cookies') === '1'; } catch(e) {}
  if (ok) return; const c = document.createElement('div'); c.className = 'cookie'; c.setAttribute('role','region'); c.setAttribute('aria-label','Aviso de cookies');
  c.innerHTML = '<p>Usamos armazenamento do navegador para guardar sua sacola e favoritos' + (CONFIG.GA_ID ? ' e cookies para medir as visitas' : '') + '. <button class="mini" data-a="panel" data-k="help" data-h="privacidade" style="padding:0">Política de privacidade</button></p><button class="btn" id="cookieOk">Entendi</button>';
  document.body.appendChild(c);
  $('cookieOk').addEventListener('click', () => { try { localStorage.setItem('maisonvell:cookies','1'); } catch(e) {} c.remove(); });
})();
addEventListener('resize', measure);
renderTabs(); renderCounts(); renderLook(); measure(); fromHash();
})();
</script>
